<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Library Management - Login & Register</title>
  
  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <!-- Font Awesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  
  <!-- Stylesheet -->
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="library-bg-overlay"></div>
  <div id="toast" class="toast"></div>

  <div class="auth-wrapper">
    <div class="auth-card">
      <!-- Header -->
      <div class="auth-header">
        <div class="logo-icon"><i class="fa-solid fa-book-bookmark"></i></div>
        <h1 class="brand-title">DIGITAL Library</h1>
        <p class="brand-subtitle">Library Management Portal</p>
      </div>

      <!-- Tab Buttons -->
      <div class="auth-tabs">
        <button id="tab-login-btn" type="button" class="tab-btn active" onclick="switchAuthTab('login')">
          <i class="fa-solid fa-lock"></i> Sign In
        </button>
        <button id="tab-register-btn" type="button" class="tab-btn" onclick="switchAuthTab('register')">
          <i class="fa-solid fa-user-plus"></i> Register
        </button>
      </div>

      <!-- Login Form -->
      <form id="login-form" class="auth-form" onsubmit="handleLogin(event)">
        <div class="input-group">
          <label for="login-email">Email Address</label>
          <div class="input-field">
            <i class="fa-solid fa-envelope"></i>
            <input type="email" id="login-email" name="email" autocomplete="username" placeholder="name@domain.com" required />
          </div>
        </div>

        <div class="input-group">
          <label for="login-password">Password</label>
          <div class="input-field">
            <i class="fa-solid fa-key"></i>
            <input type="password" id="login-password" name="password" autocomplete="current-password" placeholder="••••••••" required />
            <i class="fa-regular fa-eye toggle-pwd" onclick="togglePasswordVisibility('login-password', this)"></i>
          </div>
        </div>

        <!-- Extra: Remember Me & Forgot Password -->
        

        <button type="submit" class="submit-btn">
          Access Dashboard <i class="fa-solid fa-arrow-right"></i>
        </button>

        <p class="switch-helper">
          Don't have an account? <button type="button" class="text-link-btn" onclick="switchAuthTab('register')">Register here</button>
        </p>
      </form>

      <!-- Register Form -->
      <form id="register-form" class="auth-form hidden" onsubmit="handleRegister(event)">
        <div class="input-group">
          <label for="reg-name">Full Name</label>
          <div class="input-field">
            <i class="fa-solid fa-user"></i>
            <input type="text" id="reg-name" name="name" placeholder="Enter Full Name" required />
          </div>
        </div>

        <!-- Extra: User Role Dropdown -->
        

        <div class="input-group">
          <label for="reg-mobile">Mobile Number</label>
          <div class="input-field">
            <i class="fa-solid fa-phone"></i>
            <input type="tel" id="reg-mobile" name="mobile" placeholder="10-digit number" pattern="[0-9]{10}" title="Please enter a valid 10-digit mobile number" required />
          </div>
        </div>

        <div class="input-group">
          <label for="reg-address">Address</label>
          <div class="input-field">
            <i class="fa-solid fa-location-dot"></i>
            <input type="text" id="reg-address" name="address" placeholder="Address" required />
          </div>
        </div>

        <div class="input-group">
          <label for="reg-email">Email Address</label>
          <div class="input-field">
            <i class="fa-solid fa-envelope"></i>
            <input type="email" id="reg-email" name="email" autocomplete="username" placeholder="name@domain.com" required />
          </div>
        </div>

        <div class="input-group">
          <label for="reg-password">Password</label>
          <div class="input-field">
            <i class="fa-solid fa-key"></i>
            <input type="password" id="reg-password" name="password" autocomplete="new-password" placeholder="Create Password (min 6 chars)" minlength="6" required />
            <i class="fa-regular fa-eye toggle-pwd" onclick="togglePasswordVisibility('reg-password', this)"></i>
          </div>
        </div>

        <button type="submit" class="submit-btn">
          Create Account <i class="fa-solid fa-circle-check"></i>
        </button>

        <p class="switch-helper">
          Already registered? <button type="button" class="text-link-btn" onclick="switchAuthTab('login')">Sign in instead</button>
        </p>
      </form>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
